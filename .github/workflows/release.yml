name: Build and release

on:
  push:
    tags: ["*"]

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
          - os: macos-latest
            rid: osx-x64
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Build release archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./build-release.ps1 ${{ matrix.rid }}

      - name: Build release archive
        if: runner.os != 'Windows'
        run: bash ./build-release.sh ${{ matrix.rid }}

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.rid }}
          path: bin/Release/net10.0/${{ matrix.rid }}.zip
          if-no-files-found: error
          compression-level: 0

  upload:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v8
        with:
          path: archives
          merge-multiple: true

      - name: Attach archives to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" archives/*.zip --clobber
          else
            gh release create "$TAG" archives/*.zip --verify-tag --draft --generate-notes --title "CodeScan $TAG"
          fi
